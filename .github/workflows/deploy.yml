name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Docs live in halfhandorg/halfhand's docs/ folder. The core repo sends
  # this event when docs change; the daily schedule is a safety net if that
  # dispatch is not configured or fails.
  repository_dispatch:
    types: [docs-updated]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Halfhand docs
        uses: actions/checkout@v4
        with:
          repository: halfhandorg/halfhand
          ref: main
          path: core
          # Full history so sync-docs can date each page from its commits.
          fetch-depth: 0
          # Cone mode also brings the repo-root files (STABILITY.md,
          # SECURITY.md) that docs pages pull in with {{#include}}.
          sparse-checkout: docs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Sync docs from the core repo
        run: npm run sync-docs
        env:
          HALFHAND_DOCS_SRC: core/docs

      - name: Build with Next.js
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
